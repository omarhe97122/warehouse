<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>توزيع تحويلات المخازن</title>
<style>
  :root{--main:#0f766e;--main2:#115e59;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--obour:#2563eb;--mkh:#c026d3;--ok:#16a34a;--danger:#dc2626;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:110px;}
  header{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header h1{margin:0;font-size:18px;}
  header p{margin:4px 0 0;font-size:12px;opacity:.85;}
  .wrap{padding:14px;max-width:720px;margin:auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut);}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--txt);}
  input:focus,select:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;}
  .btn-main{background:var(--main);color:#fff;}
  .btn-main:active{background:var(--main2);}
  .btn-add{background:#e0f2f1;color:var(--main2);border:1px dashed var(--main);}
  .btn-ghost{background:#fff;color:var(--danger);border:1px solid var(--line);}
  .route-tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-top:6px;}
  .r-obour{background:#dbeafe;color:var(--obour);}
  .r-mkh{background:#fae8ff;color:var(--mkh);}
  .r-buffer{background:#dcfce7;color:#16a34a;}
  .r-shabab{background:#ffedd5;color:#ea580c;}
  .r-none{background:#f1f5f9;color:var(--mut);}
  .item-line{display:grid;grid-template-columns:1.4fr 1fr .8fr .7fr .8fr 34px;gap:6px;margin-top:8px;align-items:center;}
  .item-line input{padding:8px;font-size:13px;}
  .item-line select{padding:8px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);}
  .item-line .i-qty{background:#f1f5f9;font-weight:700;text-align:center;}
  .item-line .del{background:#fee2e2;color:var(--danger);border:none;border-radius:8px;height:36px;font-size:18px;cursor:pointer;}
  .heads{display:grid;grid-template-columns:1.4fr 1fr .8fr .7fr .8fr 34px;gap:6px;font-size:11px;color:var(--mut);font-weight:700;margin-top:10px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .tab{flex:1 1 40%;padding:9px 4px;text-align:center;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;cursor:pointer;}
  .tab.active{background:var(--main);color:#fff;border-color:var(--main);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:8px 6px;text-align:center;}
  th{background:#f8fafc;color:var(--mut);font-size:12px;}
  .empty{text-align:center;color:var(--mut);padding:24px 10px;font-size:14px;}
  .sum{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:10px 4px 0;color:var(--main2);}
  .bottombar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px;gap:8px;z-index:20;}
  .bottombar .btn{margin:0;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;z-index:50;pointer-events:none;}
  .toast.show{opacity:1;}
  .mini{font-size:11px;color:var(--mut);margin-top:4px;}
  .hidden{display:none;}
</style>
</head>

<script>
const STORE='warehouse_transfers_v1';
let currentTab='obour';
const ROUTES={
  obour:{name:'العبور',title:'مرسل من العبور',cls:'r-obour',emoji:'🔵'},
  mkh:{name:'مخلوف',title:'مرسل من مخلوف',cls:'r-mkh',emoji:'🟣'},
  buffer:{name:'البافرزون',title:'مرسل من البافرزون',cls:'r-buffer',emoji:'🟢'},
  shabab:{name:'الشباب',title:'مرسل من الشباب',cls:'r-shabab',emoji:'🟠'}
};
const ROUTE_KEYS=['obour','mkh','buffer','shabab'];
const CODES=[
  {code:'1R1',name:'الشباب'},
  {code:'2R1',name:'العبور'},
  {code:'3R1',name:'مخلوف'},
  {code:'5W4',name:'البافرزون'},
  {code:'5W1',name:'البافرزون'}
];
function fillCodeSelects(){
  ['fromCode','toCode'].forEach(id=>{
    const sel=document.getElementById(id);
    let o='<option value="">اختار المخزن...</option>';
    CODES.forEach(c=>{o+=`<option value="${c.code}">${c.code} — ${c.name}</option>`;});
    sel.innerHTML=o;
  });
}
const CODE_ROUTE={'1R1':'shabab','2R1':'obour','3R1':'mkh','5W4':'buffer','5W1':'buffer'};
function storeName(r){return ROUTES[r]?ROUTES[r].name:'العبور';}
function factoryName(code){const k=CODE_ROUTE[norm(code)];return k&&ROUTES[k]?ROUTES[k].name:norm(code);}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||[]}catch(e){return[]}}
function save(d){localStorage.setItem(STORE,JSON.stringify(d));}
function norm(s){return (s||'').toString().trim().toUpperCase();}
function trNoExists(no,exceptId){
  const n=norm(no);
  if(!n)return false;
  return load().some(d=>norm(d.trNo)===n && d.id!==exceptId);
}
function checkTrNo(){
  const w=document.getElementById('trNoWarn');
  const v=document.getElementById('trNo').value.trim();
  if(v && trNoExists(v)){w.style.display='block';w.textContent='⚠️ رقم التحويل ('+v+') اتسجل قبل كده — اتأكد منه';}
  else{w.style.display='none';w.textContent='';}
}

function routeOf(from,to){
  const f=norm(from),t=norm(to);
  if(!CODE_ROUTE[f]||!CODE_ROUTE[t]||f===t)return 'none';
  return CODE_ROUTE[f];
}

function addItemRow(v){
  v=v||{};
  const box=document.getElementById('items');
  const div=document.createElement('div');
  div.className='item-line';
  // خانة العبوة ثابتة — اختيار من قائمة
  const packs=['IBC','DRUM','PAPER BAG','PAIL'];
  let opts='<option value="">العبوة</option>';
  packs.forEach(p=>{opts+='<option value="'+p+'">'+p+'</option>';});
  div.innerHTML='<input placeholder="الصنف" class="i-name"><select class="i-pack">'+opts+'</select><input placeholder="الوزن" inputmode="decimal" class="i-wt"><input placeholder="العدد" inputmode="numeric" class="i-cnt"><input placeholder="الكمية" class="i-qty" readonly><button class="del" title="حذف">×</button>';
  const wt=div.querySelector('.i-wt'), cnt=div.querySelector('.i-cnt'), qty=div.querySelector('.i-qty');
  // الكمية = الوزن × العدد (تطلع أوتوماتيك)
  const calc=()=>{const w=parseFloat(wt.value),c=parseFloat(cnt.value);qty.value=(!isNaN(w)&&!isNaN(c))?(Math.round(w*c*1000)/1000):'';};
  wt.addEventListener('input',calc);
  cnt.addEventListener('input',calc);
  div.querySelector('.del').onclick=()=>div.remove();
  div.querySelector('.i-name').value=v.name||'';
  div.querySelector('.i-pack').value=v.pack||'';
  wt.value=v.wt||'';
  cnt.value=v.cnt||'';
  qty.value=v.qty||'';
  calc();
  box.appendChild(div);
}

function readItems(){
  const rows=[...document.querySelectorAll('#items .item-line')];
  const out=[];
  rows.forEach(r=>{
    const name=r.querySelector('.i-name').value.trim();
    const pack=r.querySelector('.i-pack').value.trim();
    const wt=r.querySelector('.i-wt').value.trim();
    const cnt=r.querySelector('.i-cnt').value.trim();
    const qty=r.querySelector('.i-qty').value.trim();
    if(name||pack||wt||cnt||qty)out.push({name,pack,wt,cnt,qty});
  });
  return out;
}

function updatePreview(){
  const from=document.getElementById('fromCode').value;
  const to=document.getElementById('toCode').value;
  const r=routeOf(from,to);
  const el=document.getElementById('routePreview');
  if(ROUTES[r]){el.className='route-tag '+ROUTES[r].cls;el.textContent='✅ هيروح: مرسل من '+ROUTES[r].name+' الى '+factoryName(to);}
  else{el.className='route-tag r-none';el.textContent='⚠️ اختار مخزنين مختلفين عشان يتوزع';}
}

function saveTransfer(){
  const from=document.getElementById('fromCode').value.trim();
  const to=document.getElementById('toCode').value.trim();
  const items=readItems();
  const trNo=document.getElementById('trNo').value.trim();
  if(!from||!to){toast('اختار المخزن المحول منه وله');return;}
  if(items.length===0){toast('ضيف صنف واحد على الأقل');return;}
  // ===== فحص البيانات الناقصة في الأصناف (الصنف/العبوة/الوزن/العدد/الكمية) =====
  const isFull=it=>[it.name,it.pack,it.wt,it.cnt,it.qty].every(v=>v!=='');
  const incomplete=items.filter(it=>!isFull(it));
  if(incomplete.length>0){
    const msg='⚠️ بيان ناقص\nفيه '+incomplete.length+' صنف بياناته مش كاملة (الصنف/العبوة/الوزن/العدد/الكمية).\n\nهل تريد المتابعة بدون هذا البيان؟';
    if(!confirm(msg)){return;}          // إلغاء = يرجع يكمّل البيانات
  }
  const finalItems=items;               // موافق (OK) = يحفظ البيانات زي ما هي
  if(trNo && trNoExists(trNo)){
    if(!confirm('⚠️ رقم التحويل ('+trNo+') اتسجل قبل كده.\nتحب تحفظه برضه؟')){return;}
  }
  const data=load();
  data.push({id:Date.now(),trNo:trNo,trDate:document.getElementById('trDate').value,from,to,route:routeOf(from,to),items:finalItems});
  save(data);
  document.getElementById('trNo').value='';
  document.getElementById('trDate').value='';
  document.getElementById('fromCode').value='';
  document.getElementById('toCode').value='';
  document.getElementById('items').innerHTML='';
  addItemRow();updatePreview();checkTrNo();
  toast('✅ اتحفظ واتوزع');
}

function showScreen(s){
  document.getElementById('screen-add').classList.toggle('hidden',s!=='add');

function renderResults(){

  data.filter(d=>d.route===currentTab).forEach(d=>{d.items.forEach(it=>rows.push({trNo:d.trNo,...it}));});

// ===== جدول الإيميل (نفس شكل الخطاب الرسمي في الصورة المطلوبة + يظل مقروء لماكرو Outlook) =====
function dateStr(v){
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const n=v?new Date(v+'T00:00:00'):new Date();
  const p=x=>('0'+x).slice(-2);
  return {day:days[n.getDay()], full:`${n.getFullYear()}/${p(n.getMonth()+1)}/${p(n.getDate())}`};
}
function buildEmailHTML(list){
  const TW=520;                       // عرض ثابت للجدول الموحّد
  const bd='1px solid #000;';
  const base=`border:${bd}padding:7px 8px;text-align:center;font-family:Arial;font-size:14px;`;
  const cell=base;
  const hd=base+'font-weight:bold;background:#f2f2f2;';
  let html='';
  list.forEach((d,i)=>{
    const store=storeName(d.route);
    const n=d.items.length;
    const dt=dateStr(d.trDate);
    const sameAsPrev = i>0 && list[i-1].route===d.route && norm(list[i-1].to)===norm(d.to) && list[i-1].trDate===d.trDate;
    const special = d.route==='buffer' && CODE_ROUTE[norm(d.to)]==='obour';
    html+='<div dir="rtl" style="font-family:Arial;font-size:14px;margin:0 0 30px;">';
    // نص الخطاب (يتشال لو الجدول اللي قبله لنفس المصنع)
    if(!sameAsPrev){
      html+='<p style="margin:2px 0;font-weight:bold;">أ / انور الحوت</p>';
      html+='<p style="margin:2px 0;">تحية طيبة وبعد ،،،</p>';
      if(special){
        html+='<p style="margin:2px 0;">فيما يلي بيان بالأصناف المطلوب تحويلها من مخزن البفرزون إلى مخزن العبور :-</p>';
      }else{
        html+=`<p style="margin:2px 0;">برجاء الموافقة على تحويل الأصناف التالية من مخزن ${store} وذلك يوم ${dt.day} الموافق ${dt.full} :</p>`;
      }
    }
    // ===== جدول واحد موحّد بعرض ثابت وأعمدة متساوية (زي الصورة المطلوبة) =====
    html+=`<table dir="rtl" style="border-collapse:collapse;table-layout:fixed;width:${TW}px;margin:8px 0;">`;
    html+='<colgroup><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%"></colgroup>';
    // رقم التحويل — صف داخل نفس الجدول (يتشال في الحالة الخاصة)
    if(!special){
      html+=`<tr><td colspan="2" style="${hd}">رقم التحويل</td><td colspan="3" style="${cell}">${esc(d.trNo)}</td></tr>`;
    }
    // المخزن المحول منه/له — عناوين ثم قيم، بنفس عرض الجدول
    html+=`<tr><td colspan="3" style="${hd}">المخزن المحول منه</td><td colspan="2" style="${hd}">المخزن المحول له</td></tr>`;
    html+=`<tr><td colspan="3" style="${cell}">${esc(d.from)}</td><td colspan="2" style="${cell}">${esc(d.to)}</td></tr>`;
    // عنوان «بيانات التحويل» كامل العرض (يتشال في الحالة الخاصة)
    if(!special){
      html+=`<tr><td colspan="5" style="${hd}">${n>1?`بيانات التحويل ( عدد ${n} نقلة )`:'بيانات التحويل'}</td></tr>`;
    }
    // عناوين الأصناف
    html+=`<tr><td style="${hd}">الصنف</td><td style="${hd}">العبوة</td><td style="${hd}">الوزن</td><td style="${hd}">العدد</td><td style="${hd}">الكمية</td></tr>`;
    d.items.forEach(it=>{
      html+=`<tr><td style="${cell}">${esc(it.name)}</td><td style="${cell}">${esc(it.pack)}</td><td style="${cell}">${esc(it.wt)}</td><td style="${cell}">${esc(it.cnt)}</td><td style="${cell}">${esc(it.qty)}</td></tr>`;
    });
    html+='</table></div>';
  });
  return html;
}

function copyEmailTable(){
  const data=load();
  if(data.length===0){toast('مفيش تحويلات');return;}
  const html=buildEmailHTML(data);
  const tmp=document.createElement('div');tmp.textContent='(جدول التحويلات)';
  try{
    const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})});
    navigator.clipboard.write([item]).then(()=>toast('✅ اتنسخ — الزقه في الإيميل'),()=>fallbackCopy(html));
  }catch(e){fallbackCopy(html);}
}
function fallbackCopy(html){
  const d=document.createElement('div');d.contentEditable='true';d.style.position='fixed';d.style.left='-9999px';d.innerHTML=html;document.body.appendChild(d);
  const rng=document.createRange();rng.selectNodeContents(d);const sel=getSelection();sel.removeAllRanges();sel.addRange(rng);
  try{document.execCommand('copy');toast('✅ اتنسخ — الزقه في الإيميل');}catch(e){toast('النسخ مش مدعوم هنا');}
  sel.removeAllRanges();document.body.removeChild(d);
}

function openMail(){
  const data=load();
  if(data.length===0){toast('مفيش تحويلات');return;}
  let body='';
  data.forEach((d,i)=>{
    const store=storeName(d.route);
    const dt=dateStr(d.trDate);
    const sameAsPrev = i>0 && data[i-1].route===d.route && norm(data[i-1].to)===norm(d.to) && data[i-1].trDate===d.trDate;
    const special = d.route==='buffer' && CODE_ROUTE[norm(d.to)]==='obour';
    if(!sameAsPrev){
      body+=`أ / انور الحوت\n`;
      body+=`تحية طيبة وبعد ،،،\n`;
      if(special){
        body+=`فيما يلي بيان بالأصناف المطلوب تحويلها من مخزن البفرزون إلى مخزن العبور :-\n`;
      }else{
        body+=`برجاء الموافقة على تحويل الأصناف التالية من مخزن ${store} وذلك يوم ${dt.day} الموافق ${dt.full} :\n`;
      }
    }

      body+=`المخزن المحول له: ${d.to}\nالمخزن المحول منه: ${d.from}\n`;
    }else{
      body+=`رقم التحويل: ${d.trNo}\nالمخزن المحول له: ${d.to}\nالمخزن المحول منه: ${d.from}\n`;

    d.items.forEach(it=>body+=`${it.name} | ${it.pack} | ${it.wt} | ${it.cnt} | ${it.qty}\n`);
    body+='\n';
  });
  window.location.href='mailto:?subject='+encodeURIComponent('تحويلات المخازن')+'&body='+encodeURIComponent(body);

function exportCSV(){
  const data=load();
  if(data.length===0){toast('مفيش بيانات تتصدر');return;}
  const BOM='\uFEFF';
  function block(route,title){
    let s=title+'\nرقم التحويل,الصنف,العبوة,الوزن,العدد,الكمية\n';
    data.filter(d=>d.route===route).forEach(d=>{d.items.forEach(it=>{s+=[d.trNo,it.name,it.pack,it.wt,it.cnt,it.qty].map(csv).join(',')+'\n';});});
    return s+'\n';
  }
  function csv(v){v=(v==null?'':v).toString();return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  const out=BOM+block('obour','مرسل من العبور')+block('mkh','مرسل من مخلوف')+block('buffer','مرسل من البافرزون')+block('shabab','مرسل من الشباب');
  const blob=new Blob([out],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='توزيع_التحويلات.csv';a.click();
  toast('⬇️ اتصدر — افتحه بالإكسيل');
}

function sheetId(){var m=(SHEET_URL||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:'';}
function onlineMode(){return !!sheetId();}
function sheetLoad(){
  return new Promise(function(resolve,reject){
    var id=sheetId();if(!id){reject(new Error('nourl'));return;}
    var cb='glcgviz_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    var s=document.createElement('script');
    var to=setTimeout(function(){cleanup();reject(new Error('timeout'));},15000);
    function cleanup(){try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(to);}
    window[cb]=function(resp){cleanup();resolve(resp);};
    var url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=1&r='+Date.now();
    if(SHEET_TAB)url+='&sheet='+encodeURIComponent(SHEET_TAB);
    s.src=url;
    s.onerror=function(){cleanup();reject(new Error('neterr'));};
    document.head.appendChild(s);
  });
}
function cellStr(c){return c?(c.f!=null?String(c.f):(c.v!=null?String(c.v):'')):'';}
function parseExpiry(c){
  if(!c)return 0;var v=c.v;
  if(typeof v==='string'){var m=v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?/);if(m){if(m[4]!=null)return new Date(+m[1],+m[2],+m[3],+m[4],+m[5],+(m[6]||0)).getTime();return new Date(+m[1],+m[2],+m[3],23,59,59).getTime();}}
  var s=(c.f!=null?String(c.f):(v!=null?String(v):'')).trim();if(!s)return 0;
  var t=Date.parse(s);if(!isNaN(t))return t;
  var p=s.split(/[\/\-\.]/);if(p.length===3){var d=new Date(+p[2],(+p[1])-1,+p[0]);if(!isNaN(d.getTime()))return d.getTime();}
  return 0;
}
/* هل خلية «ينتهي» مكتوب فيها مدة (ساعات/دقايق) مش تاريخ؟ */
function isDurTxt(s){s=(s||'').toString();return /ساع|دقيق|دقاي|\d\s*[سد]|^\s*\d{1,3}:\d{1,2}\s*$|\d\s*(?:h|m|hr|min)/i.test(s);}
/* يحوّل المدة لميلي ثانية: يفهم «ساعة» «5 دقايق» «1:05» «نص ساعة» ... */
function parseDur(s){
  s=(s||'').toString().trim();if(!s)return 0;
  var hm=s.match(/^(\d{1,3}):(\d{1,2})$/);if(hm)return(parseInt(hm[1],10)*60+parseInt(hm[2],10))*60000;
  var t=0;
  var h=s.match(/(\d+(?:[.,]\d+)?)\s*(?:ساعات|ساعه|ساعة|hours|hour|hrs|hr|h)/i);if(h)t+=parseFloat(h[1].replace(',','.'))*3600000;
  var mi=s.match(/(\d+(?:[.,]\d+)?)\s*(?:دقائق|دقايق|دقيقه|دقيقة|minutes|minute|mins|min|m)/i);if(mi)t+=parseFloat(mi[1].replace(',','.'))*60000;
  if(t===0){var h2=s.match(/(\d+)\s*س/);if(h2)t+=parseInt(h2[1],10)*3600000;var m2=s.match(/(\d+)\s*د/);if(m2)t+=parseInt(m2[1],10)*60000;}
  if(t===0){if(/نص\s*ساع/.test(s))t=1800000;else if(/ربع\s*ساع/.test(s))t=900000;else if(/ساع/.test(s))t=3600000;else if(/دقيق|دقاي/.test(s))t=60000;}
  return t;
}
function durTxtShow(ms){if(!ms)return'-';var h=Math.floor(ms/3600000),mi=Math.round((ms%3600000)/60000);var a=[];if(h>0)a.push(h+' ساعة');if(mi>0)a.push(mi+' دقيقة');return a.length?a.join(' و'):'أقل من دقيقة';}
function remainTxt(expireAt){if(!expireAt)return'دائم';var ms=expireAt-nowMax();if(ms<=0)return'انتهت';if(ms>=86400000)return'متبقي '+daysTxt(Math.ceil(ms/86400000));var h=Math.floor(ms/3600000),mi=Math.ceil((ms%3600000)/60000);if(h>0)return'متبقي '+h+' س '+(mi>0?mi+' د':'');return'متبقي '+mi+' دقيقة';}
function isActiveTxt(s){s=(s||'').trim().toLowerCase();return['نعم','yes','true','1','مفعل','مفعّل','y','✓','فعال'].indexOf(s)>=0;}
function parseMaskTxt(s){
  s=(s||'').trim();if(!s)return 0;var low=s.toLowerCase();
  if(low==='all'||s==='الكل'||s.indexOf('كل')===0){var mm=0;PERMS.forEach(function(p){mm|=(1<<p.bit);});return mm;}
  var map={'add':'add','اضافة':'add','إضافة':'add','exp':'exp','تصدير':'exp','excel':'exp','email':'email','ايميل':'email','إيميل':'email','view':'view','عرض':'view','del':'del','مسح':'del','delete':'del'};
  var mask=0;s.split(/[،,\|\/\n]+/).forEach(function(w){w=w.trim();var k=map[w.toLowerCase()]||map[w];if(k){PERMS.forEach(function(p){if(p.k===k)mask|=(1<<p.bit);});}});
  return mask;
}
/* يتعرّف على مكان كل عمود من عنوانه — عشان الترتيب مايفرقش (يمين/شمال) */
function colIndex(resp){
  var idx={dev:0,name:1,perms:2,exp:3,active:4,perm:{}};
  try{
    var cols=resp.table.cols||[];var f={};var pm={};
    for(var i=0;i<cols.length;i++){
      var lb=((cols[i]&&cols[i].label!=null)?cols[i].label:'')+'';
      var L=lb.replace(/\s+/g,'');
      if(!L)continue;
      if(/جهاز/.test(L)&&f.dev==null){f.dev=i;continue;}
      if(/اسم/.test(L)&&f.name==null){f.name=i;continue;}
      /* أعمدة الصلاحيات الثابتة — كل صلاحية عمود لوحده */
      if(/(اضاف|إضاف|جديد)/.test(L)&&pm.add==null){pm.add=i;continue;}
      if(/(تصدير|اكسل|إكسل|excel|export)/i.test(L)&&pm.exp==null){pm.exp=i;continue;}
      if(/(ايميل|إيميل|بريد|mail|email)/i.test(L)&&pm.email==null){pm.email=i;continue;}
      if(/(عرض|نتائج)/.test(L)&&pm.view==null){pm.view=i;continue;}
      if(/(مسح|حذف|delete)/i.test(L)&&pm.del==null){pm.del=i;continue;}
      if(/صلاح/.test(L)&&f.perms==null){f.perms=i;continue;}
      if(/(ينته|انتهاء|تاريخ|مدة)/.test(L)&&f.exp==null){f.exp=i;continue;}
      if(/(مفعّل|مفعل|فعال|حالة|تفعيل|نشط)/.test(L)&&f.active==null){f.active=i;continue;}
    }
    if(f.dev!=null)idx.dev=f.dev;
    if(f.name!=null)idx.name=f.name;
    if(f.perms!=null)idx.perms=f.perms;
    if(f.exp!=null)idx.exp=f.exp;
    if(f.active!=null)idx.active=f.active;
    idx.perm=pm;
  }catch(e){}
  return idx;
}
/* خانة صلاحية مفتوحة؟ أي حاجة مكتوبة = مفتوحة، فاضية أو نفي = مقفولة */
function permOn(s){s=(s||'').toString().trim().toLowerCase();if(!s)return false;return['لا','no','false','0','✖','✗','x','×','مقفول','موقوف','بدون','-'].indexOf(s)<0;}
/* يدوّر على الجهاز في رد جوجل شيت — يقرا حسب عنوان العمود */
function rowsFromResp(resp){
  var out=[];try{var ix=colIndex(resp);var pm=ix.perm||{};var hasCols=(pm.add!=null||pm.exp!=null||pm.email!=null||pm.view!=null||pm.del!=null);var rows=resp.table.rows||[];for(var i=0;i<rows.length;i++){var c=rows[i].c||[];var dev=cellStr(c[ix.dev]).trim().toUpperCase();if(!dev)continue;var mask=0;if(hasCols){if(pm.add!=null&&permOn(cellStr(c[pm.add])))mask|=(1<<0);if(pm.exp!=null&&permOn(cellStr(c[pm.exp])))mask|=(1<<1);if(pm.email!=null&&permOn(cellStr(c[pm.email])))mask|=(1<<2);if(pm.view!=null&&permOn(cellStr(c[pm.view])))mask|=(1<<3);if(pm.del!=null&&permOn(cellStr(c[pm.del])))mask|=(1<<4);}else{mask=parseMaskTxt(cellStr(c[ix.perms]));}var expTxt=cellStr(c[ix.exp]);var dur=0,exp=0,dtag='';if(isDurTxt(expTxt)){dur=parseDur(expTxt);dtag=expTxt.trim();}else{exp=parseExpiry(c[ix.exp]);}out.push({dev:dev,name:cellStr(c[ix.name]).trim(),mask:mask,expiry:exp,durMs:dur,durTag:dtag,active:isActiveTxt(cellStr(c[ix.active]))});}}catch(e){}return out;
}
function ocGet(){try{return JSON.parse(localStorage.getItem(ACT_STORE))||null;}catch(e){return null;}}
function ocSave(o){localStorage.setItem(ACT_STORE,JSON.stringify(o));}
function applyActivation(mask,expireAt){applyPerms(mask,expireAt);startExpiryWatch(expireAt);}
function fmtDate(ts){if(!ts)return'-';var d=new Date(ts);function p(n){return(n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
/* الوقت المضمون: أعلى وقت شافه البرنامج — يمنع رجّاع الساعة لورا عشان يعيد استخدام كود منتهي */
function nowMax(){var t=Date.now();var h=0;try{h=parseInt(localStorage.getItem('glc_time_hwm')||'0',10)||0;}catch(e){}if(t>h){h=t;try{localStorage.setItem('glc_time_hwm',String(h));}catch(e){}}return h;}

function _sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),LP='length',i,j,result='',words=[];
  var abl=ascii[LP]*8,hash=_sha256.h=_sha256.h||[],k=_sha256.k=_sha256.k||[];
  var pc=k[LP],comp={};
  for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c){comp[i]=c;}hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
  ascii+='\x80';while(ascii[LP]%64-56)ascii+='\x00';
  for(i=0;i<ascii[LP];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
  words[words[LP]]=((abl/mw)|0);words[words[LP]]=(abl);
  for(j=0;j<words[LP];){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
    for(i=0;i<8;i++){hash[i]=(hash[i]+oh[i])|0;}}
  for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}
  return result;
}
function sha(s){return _sha256(unescape(encodeURIComponent(s)));}
function deviceRaw(){return[navigator.userAgent,navigator.language,navigator.platform||'',screen.width+'x'+screen.height,screen.colorDepth,(navigator.hardwareConcurrency||0),(Intl.DateTimeFormat().resolvedOptions().timeZone||'')].join('|');}
function deviceId(){return sha(deviceRaw()).slice(0,12).toUpperCase();}
var PERMS=[
  {k:'add',bit:0,name:'إضافة تحويل جديد'},
  {k:'exp',bit:1,name:'تصدير Excel'},
  {k:'email',bit:2,name:'جدول الإيميل'},
  {k:'view',bit:3,name:'عرض النتائج'},
  {k:'del',bit:4,name:'مسح كل البيانات'}
];
function hasP(mask,k){for(var i=0;i<PERMS.length;i++){if(PERMS[i].k===k)return(mask&(1<<PERMS[i].bit))!==0;}return false;}
function permsTxt(mask){var a=[];PERMS.forEach(function(p){if(mask&(1<<p.bit))a.push(p.name);});return a.length?a.join('، '):'بدون صلاحيات';}
var GL_PUBKEY='HLHydFFcQtWvfHkSg0F2aDhfwoK8m4QSrpch36obMQA';
function glUtf8(s){s=unescape(encodeURIComponent(String(s)));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
var GL_B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function glB32dec(str){str=String(str).toUpperCase().replace(/[^A-Z2-7]/g,'');var bytes=[],bits=0,val=0;for(var i=0;i<str.length;i++){var idx=GL_B32.indexOf(str[i]);if(idx<0)continue;val=(val<<5)|idx;bits+=5;if(bits>=8){bytes.push((val>>>(bits-8))&255);bits-=8;}}return new Uint8Array(bytes);}
function glB64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function verifyCode(devId,entered){entered=(entered||'').trim();var parts=entered.split('.');if(parts.length<3)return null;var mask=parseInt(parts[0],10),exp=parseInt(parts[1],10);if(isNaN(mask)||isNaN(exp))return null;var sig=glB32dec(parts.slice(2).join(''));if(sig.length!==64)return null;try{if(nacl.sign.detached.verify(glUtf8(devId+'|'+mask+'|'+exp),sig,glB64u(GL_PUBKEY)))return{mask:mask,exp:exp};}catch(e){}return null;}
function isCancelCode(devId,entered){entered=(entered||'').trim();var parts=entered.split('.');if(parts.length<2||parts[0].toUpperCase()!=='X')return false;var sig=glB32dec(parts.slice(1).join(''));if(sig.length!==64)return false;try{return nacl.sign.detached.verify(glUtf8(devId+'|CANCEL'),sig,glB64u(GL_PUBKEY));}catch(e){}return false;}
function daysTxt(d){
  if(d<=0)return'دائم';
  if(d===1)return'يوم';if(d===2)return'يومين';if(d<=10)return d+' أيام';
  return d+' يوم';
}
/* يحوّل الدقايق لنص مقروء: أيام + ساعات + دقايق */
function durLabel(mins){
  if(!mins||mins<=0)return'دائم';
  var d=Math.floor(mins/1440),h=Math.floor((mins%1440)/60),m=mins%60;var a=[];
  if(d>0)a.push(d+' يوم');if(h>0)a.push(h+' ساعة');if(m>0)a.push(m+' دقيقة');
  return a.length?a.join(' و'):'أقل من دقيقة';
}
var _expTimer=null;
function startExpiryWatch(expireAt){
  if(_expTimer)clearInterval(_expTimer);
  if(!expireAt)return;
  _expTimer=setInterval(function(){
    var bd=document.getElementById('role-badge');if(bd)bd.textContent='✓ الجهاز مسجّل · '+remainTxt(expireAt);
    if(nowMax()>expireAt){clearInterval(_expTimer);localStorage.removeItem(ACT_STORE);alert('⏰ انتهت مدة التفعيل — محتاج تفعيل جديد.');location.reload();}
  },15000);
}
function applyPerms(mask,expireAt){
  var navAdd=document.getElementById('nav-add');
  var navView=document.getElementById('nav-view');
  var navEmail=document.getElementById('nav-email');
  var navExp=document.getElementById('nav-export');
  var btnClear=document.getElementById('btn-clear');
  if(navAdd)navAdd.style.display=hasP(mask,'add')?'':'none';
  if(navView)navView.style.display=hasP(mask,'view')?'':'none';
  if(navEmail)navEmail.style.display=hasP(mask,'email')?'':'none';
  if(navExp)navExp.style.display=hasP(mask,'exp')?'':'none';
  if(btnClear)btnClear.style.display=hasP(mask,'del')?'':'none';
  if(!hasP(mask,'add')){
    if(hasP(mask,'view')){try{showScreen('view');}catch(e){}}
    else if(hasP(mask,'email')){try{showScreen('email');}catch(e){}}
  }
  var bd=document.getElementById('role-badge');
  if(!bd){bd=document.createElement('div');bd.id='role-badge';bd.setAttribute('style','position:fixed;top:8px;left:8px;z-index:40;background:#16a34a;color:#fff;font-family:Arial;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;opacity:.95;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);');document.body.appendChild(bd);}
  var rem=remainTxt(expireAt);
  bd.textContent='✓ الجهاز مسجّل · '+rem;
  bd.onclick=function(){showDeviceInfo(mask,expireAt);};
}

    else{msg.style.color='#f87171';msg.textContent='✖ كود إلغاء غلط';}

function renderLog(boxId){
  var box=document.getElementById(boxId||'dl-log');if(!box)return;
  var arr=logGet();
  if(!arr.length){box.innerHTML='<div style="font-size:12px;color:#64748b;text-align:center;padding:8px;">مفيش أكواد اتسجلت لسه.</div>';return;}
  var h='<div style="font-size:12px;font-weight:800;margin:10px 0 6px;color:#fff;">📋 سجل الأكواد ('+arr.length+')</div>';
  arr.forEach(function(r,i){
    var _mins=(typeof r.mins==='number')?r.mins:((r.days||0)*1440);
    var exp=(_mins>0)?fmtDate(r.gen+_mins*60000):'دائم';
    h+='<div style="background:#0b1220;border-radius:8px;padding:8px;margin-bottom:6px;font-size:11px;line-height:1.7;position:relative;">'+
       '<span data-del="'+i+'" style="position:absolute;top:6px;left:6px;color:#f87171;font-weight:800;cursor:pointer;">✖</span>'+
       '<div style="font-weight:800;color:#fff;">'+(r.name||'بدون اسم')+'</div>'+
       '<div style="color:#94a3b8;">الجهاز: <b style="color:#38bdf8;">'+r.devId+'</b></div>'+
       '<div style="color:#94a3b8;">الصلاحيات: '+permsTxt(r.mask)+'</div>'+
       '<div style="color:#94a3b8;">المدة: '+durLabel(_mins)+' · اتسجل: '+fmtDate(r.gen)+'</div>'+
       '<div style="color:#94a3b8;">ينتهي (تقديري): <b style="color:#fbbf24;">'+exp+'</b></div>'+
       '<div style="color:#475569;font-size:10px;">الكود: '+r.code+'</div>'+
       '</div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click',function(){var idx=+el.getAttribute('data-del');var a=logGet();a.splice(idx,1);logSave(a);renderLog(boxId);});
  });
}

function initOnline(devId){
  autoReport(devId);
  sheetLoad().then(function(resp){
    var rows=rowsFromResp(resp);var me=null;
    for(var i=0;i<rows.length;i++){if(rows[i].dev===devId){me=rows[i];break;}}
    if(me&&me.active){
      var expireAt=0;
      if(me.durMs>0){
        var kSt='glc_dstart_'+devId,kTag='glc_dtag_'+devId;
        var savedTag=localStorage.getItem(kTag)||'';
        var st=parseInt(localStorage.getItem(kSt)||'0',10);
        if(!st||savedTag!==me.durTag){st=Date.now();localStorage.setItem(kSt,String(st));localStorage.setItem(kTag,me.durTag);}
        expireAt=st+me.durMs;
      } else {
        expireAt=me.expiry||0;
      }
      if(expireAt&&Date.now()>expireAt){localStorage.removeItem(ACT_STORE);buildLockUI(devId,'⏰ خلصت مدة التفعيل — كلّم المسؤول');return;}
      if(!me.mask){localStorage.removeItem(ACT_STORE);buildLockUI(devId,'✖ مفيش صلاحيات محددة للجهاز — كلّم المسؤول');return;}
      ocSave({mask:me.mask,expiry:expireAt,lastCheck:Date.now(),online:1});
      applyActivation(me.mask,expireAt);
    } else {
      localStorage.removeItem(ACT_STORE);
      var m=(me&&!me.active)?'✖ الاشتراك موقوف — كلّم المسؤول':'الجهاز مش مضاف لسة — ابعت الرقم للمسؤول';
      buildLockUI(devId,m);
    }
  }).catch(function(){
    var raw=localStorage.getItem(ACT_STORE);var obj=null;try{obj=JSON.parse(raw);}catch(e){}
    if(obj&&obj.c){var chk=verifyCode(devId,obj.c);if(chk){var eA=(chk.exp>0)?chk.exp*60000:0;if(!(eA&&nowMax()>eA)){applyPerms(chk.mask,eA);startExpiryWatch(eA);return;}}}
    var c=ocGet();
    if(c&&c.online&&(Date.now()-c.lastCheck)<GRACE_DAYS*86400000&&(!c.expiry||Date.now()<c.expiry)){
      applyActivation(c.mask,c.expiry);
    } else {
      buildLockUI(devId,'📶 لو النت مقفول عندك في الشركة، اكتب كود التفعيل اللي هيبعتهولك المسؤول تحت.');
    }
  });
}
function initDeviceLock(){
  var devId=deviceId();
  try{autoReport(devId);}catch(e){}
  var raw=localStorage.getItem(ACT_STORE);var obj=null;try{obj=JSON.parse(raw);}catch(e){}
  if(obj&&obj.c){
    var chk=verifyCode(devId,obj.c);
    if(chk){
      var expireAt=(chk.exp>0)?chk.exp*60000:0;
      if(expireAt&&nowMax()>expireAt){localStorage.removeItem(ACT_STORE);}
      else{applyPerms(chk.mask,expireAt);startExpiryWatch(expireAt);return;}
    }
  }
  buildLockUI(devId);
}
initDeviceLock();

/* قفل الحقوق — لو اتشال أو اتغيّر الاسم البرنامج يقفل */
(function(){
  var EXPECT='by Omar Hossam';
  var locked=false;
  function lock(){
    if(locked)return; locked=true;
    document.body.innerHTML='<div style="padding:50px 24px;text-align:center;font-family:Arial;color:#b91c1c;font-size:17px;font-weight:800;line-height:1.9;">🔒 النسخة دي متعدّلة أو مش أصلية.<br>البرنامج ده من إنتاج<br><span style="color:#000;">by Omar Hossam</span></div>';
  }
  function guard(){
    var el=document.getElementById('credit-lock');
    if(!el||el.textContent.trim().replace(/\s+/g,' ')!==EXPECT){lock();return false;}
    return true;
  }
  guard();
  setInterval(guard,1200);
})();
</script>
